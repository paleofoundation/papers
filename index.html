<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages Template Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>.pages Template Builder</h1>
      <p class="intro">
        Upload a <code>.pages</code> document, extract editable text, then render it by inserting data into
        <code>{{placeholders}}</code>.
      </p>

      <section class="card">
        <h2>1) Ingest .pages document</h2>
        <input id="pagesFile" type="file" accept=".pages,application/zip" />
        <button id="extractButton">Extract template text</button>
        <p id="extractStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2>2) Template text</h2>
        <label for="templateText">Template</label>
        <textarea id="templateText" rows="12" placeholder="Extracted template text appears here..."></textarea>
        <p class="hint">Tip: Use placeholders like <code>{{clientName}}</code> or <code>{{invoice.total}}</code>.</p>
      </section>

      <section class="card">
        <h2>3) Data input + render</h2>
        <label for="jsonInput">Data (JSON)</label>
        <textarea id="jsonInput" rows="10">{
  "clientName": "Acme Co.",
  "invoice": {
    "total": "$1,250"
  },
  "date": "2026-02-14"
}</textarea>
        <div class="actions">
          <button id="renderButton">Render output text</button>
          <button id="copyButton" type="button">Copy output</button>
        </div>
        <p id="renderStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2>Output</h2>
        <pre id="renderOutput"></pre>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
