version: '3.9'
services:
  worker:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev:worker"
    ports:
      - "4010:4010"
  web:
    image: node:20
    working_dir: /app
    environment:
      - WORKER_URL=http://worker:4010
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev:web"
    ports:
      - "3000:3000"
    depends_on:
      - worker
